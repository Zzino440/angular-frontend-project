<mat-card class="container">
  <mat-card-header>
    <mat-card-title>Vocabularies</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <div class="row">
      <div class="col-md-3">
        <mat-action-list>
          <button class="fw-bold" mat-list-item *ngFor="let vocabulary of vocabularies" (click)="onVocabularySelected(vocabulary)">
            {{ vocabulary.name }}
          </button>
        </mat-action-list>
      </div>
      <div class="col-md-9">
        <app-category-list class=""></app-category-list>
      </div>
    </div>
  </mat-card-content>
</mat-card>
